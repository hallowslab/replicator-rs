[package]
name = "replicator-rs"
version = "0.1.0"
edition = "2024"
authors = ["HallowsTechLabs hallow.tech.lab@gmail.com"]
description = "Durable replication worker - replays recorded uploads to remote storage via the ExifFlow access broker"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
suppaftp = { version = "10", default-features = false, features = ["tokio-rustls-ring"] }
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1.0.9"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"], optional = true }
ed25519-dalek = { version = "3", optional = true, features = ["rand_core"] }
rand_core = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
aws-sdk-s3 = { version = "1.141.0", optional = true, default-features = false, features = ["rustls", "rt-tokio"] }
aws-smithy-http-client = { version = "1.3.0", optional = true, features = ["default-client", "rustls-ring"] }
aws-smithy-types = { version = "1", optional = true }
percent-encoding = { version = "2", optional = true }
uuid = { version = "1.24", features = ["v4"], optional = true }

[build-dependencies]
toml = "0.8"

[features]
default = ["broker", "s3"]
broker = ["dep:reqwest", "dep:ed25519-dalek", "dep:rand_core", "dep:hex"]
s3 = ["dep:aws-sdk-s3", "dep:aws-smithy-http-client", "dep:aws-smithy-types", "dep:percent-encoding", "dep:uuid"]

# Build optimization for smaller binaries
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
